#
# Native MSVC build on a Windows runner. Uses the same Conan lockfile and the
# same CMake targets as the other platforms; the toolset produces the debug
# symbols and runtime the Windows package ships with.
#
name: msvc-build

on:
  push:
    branches: [main, master]
  # Windows toolchain coverage runs on the default branch and on demand. A
  # pull request pays for the Linux build only; a Windows-only regression is
  # caught by the push run before it can reach a release.
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: msvc-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  msvc:
    name: msvc
    runs-on: windows-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1
        with:
          arch: x64

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Install toolchain
        run: |
          python -m pip install "conan==2.31.2" "cmake==4.4.4" ninja
          conan --version
          cmake --version | Select-Object -First 1

      - name: Restore Conan cache
        id: conan-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.conan2
          key: conan-msvc-${{ hashFiles('conanfile.py', 'conan/recipes/**', 'conan/locks/**') }}
          restore-keys: |
            conan-msvc-

      # Ninja keeps the object graph in the build directory, so restoring it
      # turns the next run into an incremental build. Only `main` writes it.
      - name: Restore build tree
        id: build-tree
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: build/Release
          key: msvc-build-${{ github.sha }}
          restore-keys: |
            msvc-build-

      - name: Create MSVC Conan profile
        shell: pwsh
        run: |
          conan profile detect --force
          # Follow the installed toolset (VS 2022 reports 194, VS 2026 195);
          # a hard-coded version makes Conan look for the wrong vcvars.
          $detected = conan profile show -pr default --format=json | ConvertFrom-Json
          $version = $detected.host.settings.'compiler.version'
          $profile = @"
          [settings]
          os=Windows
          arch=x86_64
          compiler=msvc
          compiler.version=$version
          compiler.cppstd=23
          compiler.runtime=dynamic
          compiler.runtime_type=Release
          build_type=Release

          [conf]
          tools.cmake.cmaketoolchain:generator=Ninja
          "@
          Set-Content -Encoding ascii "$env:USERPROFILE\.conan2\profiles\msvc" $profile
          Write-Host "MSVC toolset: $version"

      - name: Export vendor recipes
        run: python tools/vendor_export.py --profile msvc

      - name: Install dependencies
        run: |
          conan install . -pr msvc --build=missing `
            -o "&:with_crashpad=False" -o "&:with_wasm=False" `
            -o "&:lto=False" `
            -o "&:build_bench=False" `
            --lockfile=conan/locks/vendor.lock

      - name: Configure
        run: cmake --preset conan-release -DREFRAIN_WITH_CRASHPAD=OFF -DREFRAIN_WITH_WASM=OFF -DREFRAIN_BUILD_BENCH=OFF

      - name: Build
        run: cmake --build --preset conan-release -j 4

      - name: Save build tree
        if: github.ref == 'refs/heads/main' && steps.build-tree.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: build/Release
          key: msvc-build-${{ github.sha }}

      - name: Save Conan cache
        if: github.ref == 'refs/heads/main' && steps.conan-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.conan2
          key: conan-msvc-${{ hashFiles('conanfile.py', 'conan/recipes/**', 'conan/locks/**') }}

      - name: Test
        run: ctest --test-dir build/Release --output-on-failure

      - name: Upload test logs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: msvc-test-logs
          path: |
            build/Release/Testing/Temporary/LastTest.log
            build/Release/Testing/Temporary/LastTestsFailed.log
            build/Release/bin/
          if-no-files-found: ignore
