#
# Native MSVC build on a Windows runner. Uses the same Conan lockfile and the
# same CMake targets as the other platforms; the toolset produces the debug
# symbols and runtime the Windows package ships with.
#
# The workflow is dispatch-only until the MSVC port has a first green run,
# then the push/pull_request triggers are enabled.

name: msvc-build

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: msvc-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  msvc:
    name: msvc
    runs-on: windows-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Install toolchain
        run: |
          python -m pip install "conan==2.31.2" "cmake==4.4.4" ninja
          conan --version
          cmake --version | Select-Object -First 1

      - name: Restore Conan cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.conan2
          key: conan-msvc-${{ hashFiles('conanfile.py', 'conan/recipes/**', 'conan/locks/**') }}
          restore-keys: |
            conan-msvc-

      - name: Create MSVC Conan profile
        shell: pwsh
        run: |
          conan profile detect --force
          $profile = @"
          [settings]
          os=Windows
          arch=x86_64
          compiler=msvc
          compiler.version=194
          compiler.cppstd=23
          compiler.runtime=dynamic
          compiler.runtime_type=Release
          build_type=Release

          [conf]
          tools.cmake.cmaketoolchain:generator=Ninja
          "@
          Set-Content -Encoding ascii "$env:USERPROFILE\.conan2\profiles\msvc" $profile

      - name: Export vendor recipes
        run: python tools/vendor_export.py --profile msvc

      - name: Install dependencies
        run: |
          conan install . -pr msvc --build=missing `
            -o "&:with_crashpad=False" -o "&:with_wasm=False" `
            -o "&:build_bench=False" `
            --lockfile=conan/locks/vendor.lock

      - name: Configure
        run: cmake --preset conan-release -DREFRAIN_WITH_CRASHPAD=OFF -DREFRAIN_WITH_WASM=OFF -DREFRAIN_BUILD_BENCH=OFF

      - name: Build
        run: cmake --build --preset conan-release -j 4

      - name: Test
        run: ctest --test-dir build/Release --output-on-failure
