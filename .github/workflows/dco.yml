#
# DCO gate. Every commit in the pull request must carry a
# `Signed-off-by: Name <email>` trailer that matches the commit author and
# certifies the Developer Certificate of Origin 1.1. The range needs the full
# history, so the checkout is not shallow.

name: dco

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: dco-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dco:
    name: dco
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check sign-offs
        env:
          COMMIT_RANGE: ${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}
        run: python3 tools/check_dco.py "$COMMIT_RANGE"
