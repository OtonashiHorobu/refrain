#
# Full Windows build with MinGW: compiles the real server and tools and runs
# them under Wine. The build runs in an Arch container because the project
# needs MinGW GCC 16, which the Ubuntu runner does not package. The checkout
# stays on the runner so the Node-based actions do not depend on the container
# image.

name: mingw-build

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mingw:
    name: mingw
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Restore Conan cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: .conan-cache
          key: conan-mingw-${{ hashFiles('conanfile.py', 'conan/recipes/**', 'conan/locks/**') }}
          restore-keys: |
            conan-mingw-

      - name: Build in container
        run: |
          mkdir -p .conan-cache
          docker run --rm \
            -v "$PWD:/src" \
            -v "$PWD/.conan-cache:/root/.conan2" \
            -w /src archlinux:latest bash -lc '
              set -euo pipefail
              pacman -Syu --noconfirm --needed base-devel git python python-pip \
                cmake ninja mingw-w64-gcc mingw-w64-binutils wine \
                xorg-server-xvfb nasm perl
              # OpenSSL's MinGW makefile invokes `windres` without the target
              # prefix; expose the cross resource compiler under that name.
              ln -sf /usr/bin/x86_64-w64-mingw32-windres /usr/local/bin/windres
              python3 -m pip install --break-system-packages "conan==2.31.2"

              conan profile detect --force
              native_gcc="$(gcc -dumpversion | cut -d. -f1)"
              mkdir -p /root/.conan2/profiles
              printf "%s\n" \
                "[settings]" \
                "os=Linux" \
                "arch=x86_64" \
                "compiler=gcc" \
                "compiler.version=${native_gcc}" \
                "compiler.cppstd=26" \
                "compiler.libcxx=libstdc++11" \
                "build_type=Release" \
                "" \
                "[conf]" \
                "tools.cmake.cmaketoolchain:generator=Ninja" \
                > /root/.conan2/profiles/gcc-release
              mingw_gcc="$(x86_64-w64-mingw32-g++ -dumpversion | cut -d. -f1)"
              printf "%s\n" \
                "[settings]" \
                "os=Windows" \
                "arch=x86_64" \
                "compiler=gcc" \
                "compiler.version=${mingw_gcc}" \
                "compiler.cppstd=26" \
                "compiler.libcxx=libstdc++11" \
                "build_type=Release" \
                "" \
                "[conf]" \
                "tools.cmake.cmaketoolchain:generator=Ninja" \
                "tools.build:compiler_executables={\"c\":\"x86_64-w64-mingw32-gcc\",\"cpp\":\"x86_64-w64-mingw32-g++\"}" \
                > /root/.conan2/profiles/mingw

              python3 tools/vendor_export.py --profile gcc-release

              conan install . -pr gcc-release -of build/host --build=missing \
                -o "&:with_crashpad=False" -o "&:with_wasm=False" \
                -o "&:build_tests=False" -o "&:build_bench=False"
              cmake -S . -B build/host/build/Release -G Ninja \
                -DCMAKE_TOOLCHAIN_FILE=build/host/build/Release/generators/conan_toolchain.cmake \
                -DCMAKE_BUILD_TYPE=Release \
                -DREFRAIN_BUILD_SERVER=OFF \
                -DREFRAIN_BUILD_TESTS=OFF \
                -DREFRAIN_BUILD_BENCH=OFF \
                -DREFRAIN_WITH_CRASHPAD=OFF \
                -DREFRAIN_WITH_WASM=OFF
              cmake --build build/host/build/Release -j "$(nproc)" --target refrain-tools

              conan install . -pr mingw --build=missing \
                -o "&:with_crashpad=False" -o "&:with_wasm=False" \
                -o "&:build_tests=False" -o "&:build_bench=False" \
                --lockfile=conan/locks/vendor.lock
              cmake -S . -B build/Release -G Ninja \
                -DCMAKE_TOOLCHAIN_FILE=build/Release/generators/conan_toolchain.cmake \
                -DCMAKE_BUILD_TYPE=Release \
                -DREFRAIN_BUILD_TESTS=OFF \
                -DREFRAIN_BUILD_BENCH=OFF \
                -DREFRAIN_WITH_CRASHPAD=OFF \
                -DREFRAIN_WITH_WASM=OFF \
                -DREFRAIN_HOST_TOOLS="/src/build/host/build/Release/bin/refrain-tools" \
                -DCMAKE_EXE_LINKER_FLAGS=-static
              cmake --build build/Release -j "$(nproc)" \
                --target refrain-server refrain-tools

              xvfb-run -a wine build/Release/bin/refrain-tools.exe version
              xvfb-run -a wine build/Release/bin/refrain-server.exe --help
            '
