#
# Legacy external manifest with no `[entry].loader`: the loader is inferred
# from the native payload and `refrain-tools mods check` reports the inference
# as deprecated. The fixture is never loaded.

[mod]
id = "legacy.native"
version = "1.0.0"
abi = "1"
side = "server"

[entry]
native = "lib/liblegacy.so"
