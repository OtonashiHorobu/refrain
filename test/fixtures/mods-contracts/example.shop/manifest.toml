# Custom contract declaration fixture: the owner defines `example:shop`,
# provides it, and publishes its generated vtable layout.
[mod]
id = "example.shop"
version = "1.0.0"
abi = "1"
side = "server"

[meta]
display_name = "Example shop"

[provides]
services = ["example:shop"]

[contracts."example:shop"]
version = "1.0.0"
vtable_size = 32
compatible = ">=1.0.0 <2.0.0"
trusted_providers = ["example.shop.extra"]
