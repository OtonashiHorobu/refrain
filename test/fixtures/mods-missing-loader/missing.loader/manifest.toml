#
# External manifest that omits `[entry].loader`. The manifest is rejected: an
# external package must name the loader that executes it.

[mod]
id = "missing.loader"
version = "1.0.0"
abi = "1"
side = "server"

[entry]
native = "lib/libmissing.so"
