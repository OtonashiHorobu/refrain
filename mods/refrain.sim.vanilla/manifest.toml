#
# First-party bundled mod: statically linked, no [entry] section. The
# manifest is packed into builtin.image so the composition and loader path are
# exercised end to end by the test suite.

[mod]
id = "refrain.sim.vanilla"
version = "1.0.0"
abi = "1"
side = "server"

[meta]
display_name = "refrain.sim.vanilla"
description = "Headless simulation core."
license = "MIT"

[provides]
services = ["refrain:sim"]

[requires]
"refrain.world.vanilla" = "^1.0.0"
"refrain.worldgen.vanilla" = "^1.0.0"
