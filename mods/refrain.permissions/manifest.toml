#
# Built-in permission service: a first-party static mod with no [entry]
# section. Its factory publishes the `refrain:permissions` chain base (the
# configuration-driven default resolver); the manifest is packed into
# builtin.image so the composition and loader path are exercised end to end.

[mod]
id = "refrain.permissions"
version = "1.0.0"
abi = "1"
side = "server"

[meta]
display_name = "refrain.permissions"
description = "Built-in permission service and default resolver."
license = "MIT"

[provides]
services = ["refrain:permissions"]
