# First-party bundled mod. The server runtime is a system mod like every other
# provider; this manifest carries its identity into builtin.image while the
# code is statically linked into the host.

[mod]
id = "refrain.server.vanilla"
version = "1.0.0"
abi = "1"
side = "server"

[meta]
display_name = "refrain.server.vanilla"
description = "Dedicated server runtime host provider."
license = "MIT"

[provides]
services = ["refrain:runtime", "refrain:session"]

[requires]
"refrain.data.vanilla" = "^1.0.0"
"refrain.world.vanilla" = "^1.0.0"
"refrain.sim.vanilla" = "^1.0.0"
"refrain.storage.rwf" = "^1.0.0"
