#
# First-party bundled mod: statically linked, no [entry] section. It provides
# the `refrain:world.migration` contract, so a gamepack can drop it to refuse
# older worlds instead of upgrading them.

[mod]
id = "refrain.world.datafix"
version = "1.0.0"
abi = "1"
side = "server"

[meta]
display_name = "refrain.world.datafix"
description = "World data version migration provider."
license = "MIT"

[provides]
services = ["refrain:world.migration"]
